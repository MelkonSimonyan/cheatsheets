name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Check build output
        run: |
          test -f out/index.html
          test -f out/og.png
          # Every /pdf, /posts and /thumbs path referenced in the content must exist in the build.
          grep -oE '"/(pdf|posts|thumbs)/[^"]+"' src/data/cycles.ts | tr -d '"' | while read -r p; do
            test -f "out$p" || { echo "::error::Missing file in build: $p"; exit 1; }
          done

      - name: Deploy via SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          localDir: ./out/
          remoteDir: /home/cheatsheets/htdocs/cheatsheets.melkonsimonyan.com/
          removeExtraFilesOnServer: true
